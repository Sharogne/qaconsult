name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Les tests gardent aussi les pull requests : sans ce déclencheur, une suite
  # cassée ne se voyait qu'une fois le code déjà sur main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Un groupe par référence : une pull request ne vient plus faire la queue
  # derrière un déploiement de main, et un nouveau push sur une PR annule le
  # run précédent. Sur main, rien n'est annulé — un déploiement va au bout.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig.json ne couvre que cypress/ : c'est un contrôle du code de
      # test, sa place est donc ici. Avant Cypress, pour qu'une erreur de
      # typage échoue en quelques secondes plutôt qu'après la suite complète.
      - name: Typecheck
        run: npm run lint

      - name: Run Cypress tests
        run: npm run cy:run

  deploy:
    needs: [build, e2e]
    # Une pull request valide le build et les tests, mais ne publie jamais.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
